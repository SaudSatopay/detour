# Not active yet. GitHub runs workflows only from .github/workflows/, and the token this
# repository is pushed with lacks the workflow scope, so this file waits here. To enable it:
#   mkdir -p .github/workflows && cp scripts/ci/graph.workflow.yml .github/workflows/graph.yml
# Until then the same checks run by hand: pnpm typecheck, lint, test, test:verify, ci:scenarios,
# eval:closures and judge (see CLAIMS.md).
name: graph

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  scenarios:
    # Every graph tool on the three demo closures, with max flow certified and cross-checked
    # against the independent NetworkX results, then every README claim re-measured.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The engine Detour runs on: FalkorDB 4.22 (the evidence sandbox reports module 42201,
        # i.e. 4.22.1). Docker Hub's "6.0.2" tag is a different release line Detour never ran on.
        falkordb: ["v4.22.1"]
    services:
      falkordb:
        image: falkordb/falkordb:${{ matrix.falkordb }}
        ports:
          - 6379:6379
        env:
          FALKORDB_ARGS: "TIMEOUT_MAX 60000 TIMEOUT_DEFAULT 30000 RESULTSET_SIZE 200000 MAX_QUEUED_QUERIES 500"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - name: Probe procedure shapes
        run: pnpm tsx scripts/ci/probe.ts
        env:
          FALKORDB_URL: falkor://localhost:6379
      - name: Run scenarios
        run: pnpm tsx scripts/ci/run-scenarios.ts
        env:
          FALKORDB_URL: falkor://localhost:6379
      - name: Re-measure the README's claims
        run: pnpm judge
        env:
          FALKORDB_URL: falkor://localhost:6379
      - name: algo.maxFlow reproduction (informational)
        run: pnpm judge:maxflow 100
        env:
          FALKORDB_URL: falkor://localhost:6379
      - name: Concurrency benchmark
        run: pnpm tsx scripts/ci/bench.ts
        env:
          FALKORDB_URL: falkor://localhost:6379
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-out-${{ matrix.falkordb }}
          path: ci-out/

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --with networkx --with pytest pytest scripts/verify/test_verify.py -q
